# Full S-NIAH trajectories with Qwen3.5-397B-A17B through OpenRouter.
# S-NIAH is RULER niah_single_1: 50 examples in each token bucket.
server:
  base_url: "https://openrouter.ai/api/v1"
  api_key: ""  # loaded only from OPENROUTER_API_KEY
  model: "qwen/qwen3.5-397b-a17b"  # override with MODEL for another reported arm
  cache_dir: "hf_cache"
  scratch_dir: "hf_cache/tmp"

fold:
  chunk_chars: 24000  # matched ACS chunk size
  notes_chars: 6000   # rolling-tail note capacity
  notes_tokens: 1500  # maximum generated notes per fold
  draft_tokens: 32    # ample for S-NIAH's seven-digit open answer
  workers: 8

stopping:
  theta_grid: [0.995]
  eps_grid: [0.005, 0.01, 0.02, 0.05]
  stability_window: 3
  tolerance: 0.02

online_stop:
  rule: none                  # full trajectories for offline paired replay
  theta: 0.995                # official frozen ACS operating point
  eps: 0.05
  window: 3
  min_chunks: 2
  record_verbalized: true     # record numeric asked-confidence comparator
  record_gate: true           # record asked END/CONTINUE comparator

benchmarks:
  buckets_tokens: [8192, 16384, 32768, 65536, 131072]
  sniah:
    n: 250
    seed: 0

paths:
  data_dir: "data"
  results_dir: "results"

