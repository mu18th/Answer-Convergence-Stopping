  min_chunks: 2
  record_verbalized: true
  record_gate: true
benchmarks:
  browsecomp_plus:
    n: 830
    seed: 0
    documents_per_query: 10
    max_distractor_chars: 16000
paths:
  data_dir: "data"
  results_dir: "results"
