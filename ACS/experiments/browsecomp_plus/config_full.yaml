server:
  base_url: "https://openrouter.ai/api/v1"
  api_key: ""
  model: "qwen/qwen3.5-397b-a17b"  # launcher overrides with MODEL for Kimi
  cache_dir: "hf_cache"
  scratch_dir: "hf_cache/tmp"
fold:
  chunk_chars: 24000
  notes_chars: 6000
  notes_tokens: 1500
  draft_tokens: 32
  workers: 8
stopping:
  theta_grid: [0.995]
  eps_grid: [0.05]
